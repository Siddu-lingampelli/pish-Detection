name: Keep Render alive

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        env:
          RENDER_URL: ${{ secrets.RENDER_URL || 'https://phishguard.onrender.com' }}
        run: |
          url="${RENDER_URL}/health"
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$url" || echo "000")
          echo "Pinged $url -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::warning::Health check returned $code"
          fi
