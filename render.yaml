services:
  - type: web
    name: phishguard
    runtime: node
    plan: free
    buildCommand: npm ci --prefix client && npm ci --prefix server && npm run build --prefix client
    startCommand: node server/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: GOOGLE_SAFE_BROWSING_API_KEY
        sync: false
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: URLSCAN_API_KEY
        sync: false
    autoDeploy: true
